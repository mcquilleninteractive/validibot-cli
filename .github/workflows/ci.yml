name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.5.1
      - name: Detect private keys
        run: pre-commit run detect-private-key --all-files
      - name: Scan tracked files with TruffleHog
        run: pre-commit run trufflehog --all-files

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          python -m pip install -e ".[dev]"

      - name: Audit dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit

      - name: Run linting
        run: ruff check .

      - name: Run type checking
        run: mypy src/

      - name: Run tests with coverage
        run: pytest --cov=validibot_cli --cov-report=term-missing

      - name: Test CLI installation
        run: |
          validibot --version
          validibot --help

  deps:
    name: deps (lock + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Verify the lockfile is in sync with pyproject.toml
        # Fails if uv.lock has drifted from pyproject (e.g. a dependency was
        # changed without re-locking) so the committed lock can't silently rot.
        run: uv lock --check
      - name: Audit the locked dependency set for known vulnerabilities
        # Audits the EXACT resolved versions in uv.lock — not a fresh
        # floors-resolved set — so a CVE pinned in the lock is caught here even
        # when a clean install would pull a fixed version.
        run: |
          uv export --frozen --no-emit-project \
            --format requirements-txt -o requirements-audit.txt
          uvx --from pip-audit==2.10.1 pip-audit -r requirements-audit.txt

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [security, test, deps]
    steps:
      - run: echo "All checks passed."
